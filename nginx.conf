types {
    text/html                             html htm shtml;
    text/css                              css;
    text/xml                              xml;
    image/gif                             gif;
    image/jpeg                            jpeg jpg;
    application/javascript                js mjs;
    application/json                      json;
    application/wasm                      wasm;
    application/octet-stream              bin npz;
    model/gltf-binary                     glb;
    model/gltf+json                       gltf;
    image/png                             png;
    image/svg+xml                         svg svgz;
    image/webp                            webp;
    audio/mpeg                            mp3;
    font/ttf                              ttf;
    font/woff                             woff;
    font/woff2                            woff2;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;
    gzip_min_length 1000;

    # Default Root -> 3D Fruit Fly World Simulator
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # 3D Fruit Fly World Simulator
    location /simulation/ {
        alias /usr/share/nginx/html/simulation/;
        try_files $uri $uri/ /simulation/index.html =404;
    }

    # Documentation & Project Information
    location /info/ {
        alias /usr/share/nginx/html/info/;
        try_files $uri $uri/ /info/index.html =404;
    }

    # Alias /docs/ to /info/
    location /docs/ {
        alias /usr/share/nginx/html/info/;
        try_files $uri $uri/ /info/index.html =404;
    }

    # Fly Radio
    location /radio/ {
        alias /usr/share/nginx/html/radio/;
        try_files $uri $uri/ /radio/index.html =404;
    }

    # Fly Roulette
    location /roulette/ {
        alias /usr/share/nginx/html/roulette/;
        try_files $uri $uri/ /roulette/index.html =404;
    }

    # Flinder
    location /flinder/ {
        alias /usr/share/nginx/html/flinder/;
        try_files $uri $uri/ /flinder/index.html =404;
    }

    # Flybook React SPA
    location /flybook/ {
        alias /usr/share/nginx/html/flybook/;
        try_files $uri $uri/ /flybook/index.html =404;
    }

    # Compute UI
    location /compute/ {
        alias /usr/share/nginx/html/compute/;
        try_files $uri $uri/ /compute/index.html =404;
    }

    # Cache control for static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|wasm|bin|glb)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
