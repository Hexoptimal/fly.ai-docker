<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLYBRAIN</title>
<style>
:root{--bg:#0b0d10;--panel:#12161b;--line:#222a33;--text:#e7ecf1;--dim:#8793a0;--amber:#ffb23e;--red:#ff5a5a;--cyan:#3ed8ff;--green:#6cf08a;--pink:#ff5ad2;--yellow:#ffe14d}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  padding-block:12px;padding-inline:16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
header{flex:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px}
h1{margin:0;font-size:19px;letter-spacing:.08em;white-space:nowrap}
h1 b{color:var(--amber)}
.sub{color:var(--dim);font-size:12px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0;min-height:0;display:flex;flex-direction:column}
.panel.grow{flex:1}
.panel h2{flex:none;margin:0 0 8px;font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;
  display:flex;justify-content:space-between;gap:12px;white-space:nowrap;overflow:hidden}
.panel h2 span:last-child{overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:.02em}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.game{position:relative;background:#000;border-radius:6px;overflow:hidden}
.game canvas{position:absolute;inset:0;width:100%;height:100%}
.game iframe{position:absolute;left:0;top:0;width:1280px;height:1100px;border:0;transform-origin:0 0;pointer-events:none}
#brain{display:block}
.small{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:grid;grid-template-columns:6.8em 1fr 1fr;gap:6px;align-items:center;margin:3px 0}
.row span{color:var(--dim);white-space:nowrap}
.row small{opacity:.7}
.bar{height:10px;background:#0a0c0f;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0}
.buttons{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{padding:3px 9px;border:1px solid var(--line);border-radius:4px;color:var(--dim)}
.btn.on{background:var(--amber);color:#000;border-color:var(--amber)}
.legend{flex:none;display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--dim);font-size:11px;margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
a{color:var(--cyan)}
@media (max-width:900px){
  body{overflow:auto;height:auto}
  main{display:flex;flex-direction:column}
  .panel.grow .wrap{flex:none;height:62vw}
  #brainpanel .wrap{height:92vw}
}
@media (max-width:560px){.small{grid-template-columns:1fr}}
</style></head><body>
<header><h1><b>FLYBRAIN</b> vs <span id="oppname">?</span></h1>
<div class="sub" id="stats">connecting...</div></header>
<main>
  <div class="col">
    <section class="panel grow"><h2><span>The fight</span><span id="watch">offline: game state as the fly receives it</span></h2>
      <div class="wrap" id="gamewrap"><div class="game" id="game">
        <canvas id="arena" width="960" height="640"></canvas>
        <iframe id="live" hidden title="live match" scrolling="no" tabindex="-1"></iframe>
      </div></div>
    </section>
    <div class="small">
      <section class="panel"><h2><span>Eyes → brain</span><span>left · right</span></h2>
        <div class="row"><span>looming</span><div class="bar"><i id="loomL" style="background:var(--red)"></i></div><div class="bar"><i id="loomR" style="background:var(--red)"></i></div></div>
        <div class="row"><span>threat</span><div class="bar"><i id="threatL" style="background:var(--pink)"></i></div><div class="bar"><i id="threatR" style="background:var(--pink)"></i></div></div>
        <div class="row"><span>shots</span><div class="bar"><i id="shotL" style="background:var(--yellow)"></i></div><div class="bar"><i id="shotR" style="background:var(--yellow)"></i></div></div>
        <div class="row"><span>chase</span><div class="bar"><i id="chaseL" style="background:var(--cyan)"></i></div><div class="bar"><i id="chaseR" style="background:var(--cyan)"></i></div></div>
        <div class="buttons"><span class="btn" id="b-left">◀</span><span class="btn" id="b-right">▶</span><span class="btn" id="b-jump">JUMP</span><span class="btn" id="b-punch">PUNCH</span><span class="btn" id="b-kick">KICK</span></div>
      </section>
      <section class="panel"><h2><span>Brain → buttons</span><span>last 0.5 s · L · R</span></h2>
        <div id="motor"></div>
      </section>
    </div>
  </div>
  <section class="panel" id="brainpanel"><h2><span>Nervous system</span><span id="spk"></span></h2>
    <div class="wrap" id="brainwrap"><canvas id="brain" width="900" height="900"></canvas></div>
    <div class="legend"><span><i style="background:var(--amber)"></i>fired</span><span><i style="background:var(--red)"></i>looming (LPLC2)</span><span><i style="background:var(--pink)"></i>threat (LC4)</span><span><i style="background:var(--yellow)"></i>shots (LPLC1)</span><span><i style="background:var(--cyan)"></i>chase (LC10a)</span><span><i style="background:var(--green)"></i>command neurons</span></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let S = null, base = null, glow = null;
const brain = $("brain"), bctx = brain.getContext("2d");
const arena = $("arena"), actx = arena.getContext("2d");
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// Where the fight canvas sits on sshfighter.com/watch/<id> when that page is 1280 px wide.
const CROP = { x: 73, y: 264, w: 1135, h: 757 };

function fit(el, wrap, ratio) {
  const W = wrap.clientWidth, H = wrap.clientHeight || W / ratio;
  let w = W, h = W / ratio;
  if (h > H) { h = H; w = H * ratio; }
  el.style.width = `${Math.floor(w)}px`; el.style.height = `${Math.floor(h)}px`;
  return w;
}
function layout() {
  const w = fit($("game"), $("gamewrap"), CROP.w / CROP.h);
  const s = w / CROP.w;
  $("live").style.transform = `translate(${-CROP.x * s}px, ${-CROP.y * s}px) scale(${s})`;
  fit(brain, $("brainwrap"), 1);
}
addEventListener("resize", layout);

async function init() {
  layout();
  S = await (await fetch("/static.json")).json();
  $("stats").textContent = `${S.neurons.toLocaleString()} neurons · ${S.connections.toLocaleString()} connections · male fruit fly connectome (MaleCNS v1.0)`;
  base = document.createElement("canvas"); base.width = base.height = 900;
  const g = base.getContext("2d"); g.fillStyle = "rgba(150,170,190,0.13)";
  for (let i = 0; i < S.x.length; i++) g.fillRect(S.x[i] * 0.9, S.y[i] * 0.9, 1.6, 1.6);
  glow = document.createElement("canvas"); glow.width = glow.height = 900;
  const m = $("motor");
  for (const [key, [neuron, action]] of Object.entries(S.labels)) {
    m.insertAdjacentHTML("beforeend", `<div class="row"><span>${neuron} <small>${action}</small></span><div class="bar"><i id="m-${key}_L" style="background:var(--green)"></i></div><div class="bar"><i id="m-${key}_R" style="background:var(--green)"></i></div></div>`);
  }
  layout();
  new EventSource("/events").onmessage = (e) => draw(JSON.parse(e.data));
}

function drawBrain(d) {
  const g = glow.getContext("2d");
  g.globalCompositeOperation = "destination-out"; g.fillStyle = "rgba(0,0,0,0.35)"; g.fillRect(0, 0, 900, 900);
  g.globalCompositeOperation = "source-over"; g.fillStyle = css("--amber");
  for (const i of d.spikes) g.fillRect(S.x[i] * 0.9 - 1, S.y[i] * 0.9 - 1, 2.4, 2.4);
  bctx.fillStyle = css("--panel"); bctx.fillRect(0, 0, 900, 900);
  bctx.drawImage(base, 0, 0); bctx.drawImage(glow, 0, 0);
  const tint = (ids, color, a) => { if (a <= 0) return; bctx.globalAlpha = Math.min(1, a * 1.25); bctx.fillStyle = color;
    for (const i of ids) bctx.fillRect(S.x[i] * 0.9 - 1.5, S.y[i] * 0.9 - 1.5, 3.2, 3.2); bctx.globalAlpha = 1; };
  const colors = { loom: "--red", threat: "--pink", shot: "--yellow", chase: "--cyan" };
  for (const s of "LR") for (const [ch, c] of Object.entries(colors)) tint(S.groups[ch + s] || [], css(c), d.drive[ch + s] || 0);
  bctx.font = "600 17px ui-monospace,Consolas,monospace";
  for (const [key, [neuron]] of Object.entries(S.labels)) for (const s of "LR") {
    const ids = S.groups[`${key}_${s}`] || []; if (!ids.length) continue;
    const on = d.now[`${key}_${s}`];
    for (const i of ids) {
      const x = S.x[i] * 0.9, y = S.y[i] * 0.9;
      bctx.beginPath(); bctx.arc(x, y, on ? 11 : 6, 0, Math.PI * 2);
      bctx.fillStyle = on ? css("--green") : "rgba(108,240,138,0.25)"; bctx.fill();
      bctx.strokeStyle = css("--green"); bctx.lineWidth = 1.5; bctx.stroke();
    }
    if (!on) continue;  // label only while firing, so labels don't pile up
    const i = ids[0], x = S.x[i] * 0.9, y = S.y[i] * 0.9;
    bctx.fillStyle = css("--text");
    bctx.textAlign = s === "L" ? "right" : "left";
    bctx.fillText(`${neuron} ${s}`, x + (s === "L" ? -15 : 15), y + 5);
  }
}

function drawArena(d) {
  const W = 960, H = 640, gx = (x) => (x / 240) * W, ground = H - 70, gy = (y) => ground - y * 2.6;
  actx.fillStyle = "#0e1218"; actx.fillRect(0, 0, W, H);
  actx.fillStyle = "#1b222b"; actx.fillRect(0, ground, W, H - ground);
  actx.fillStyle = "#2a333e"; actx.fillRect(gx(22), ground, 3, 18); actx.fillRect(gx(218), ground, 3, 18);
  const fighter = (f, color, label, dy) => {
    const x = gx(f.x), y = gy(f.y);
    actx.fillStyle = color; actx.beginPath(); actx.roundRect(x - 26, y - 150, 52, 150, 10); actx.fill();
    actx.fillStyle = "#000"; actx.beginPath(); actx.arc(x + 12 * f.facing, y - 122, 7, 0, 7); actx.fill();
    actx.fillStyle = css("--text"); actx.font = "600 20px ui-monospace,Consolas,monospace"; actx.textAlign = "center";
    actx.fillText(label, x, y - 162 - dy);
  };
  const close = Math.abs(d.you.x - d.opp.x) < 30 ? 24 : 0;   // keep labels apart when fighters overlap
  fighter(d.opp, "#8a95a3", d.opp.name || "OPPONENT", close);
  fighter(d.you, css("--amber"), "FLY", 0);
  for (const [x, y, hostile] of d.shots) { actx.fillStyle = hostile ? css("--red") : css("--cyan");
    actx.beginPath(); actx.arc(gx(x), gy(y), 13, 0, 7); actx.fill(); }
  const hp = (v, x0, dir) => { actx.fillStyle = "#222"; actx.fillRect(x0, 22, 380 * dir, 20);
    actx.fillStyle = v > 30 ? css("--green") : css("--red"); actx.fillRect(x0, 22, 3.8 * v * dir, 20); };
  hp(d.you.hp, 30, 1); hp(d.opp.hp, W - 30, -1);
  actx.fillStyle = css("--dim"); actx.font = "16px ui-monospace,Consolas,monospace"; actx.textAlign = "center";
  actx.fillText(`round ${d.round ?? "-"} · ${d.phase ?? ""}`, W / 2, 38);
}

let liveMid = null;
function draw(d) {
  drawBrain(d);
  $("oppname").textContent = d.opp_name || d.opp.name || "dummy";
  $("spk").textContent = `${d.total.toLocaleString()} spikes/frame · ${d.ms} ms`;
  if (d.mid && d.mid !== liveMid) {
    liveMid = d.mid; const url = `https://sshfighter.com/matches/${d.mid}`;   // works live AND after the match
    $("live").src = url; $("live").hidden = false; $("arena").hidden = true;
    $("watch").innerHTML = `<a href="${url}" target="_blank" rel="noopener">on sshfighter.com ↗</a>`;
    layout();
  }
  if (!d.mid) {                       // offline or replay: draw the arena ourselves
    if (liveMid !== null) {           // coming back from a live match, put the iframe away
      liveMid = null;
      $("live").hidden = true; $("live").src = "about:blank";
      $("arena").hidden = false;
      $("watch").textContent = "replay: game state as the fly receives it";
      layout();
    }
    drawArena(d);
  }
  for (const [k, v] of Object.entries(d.drive)) { const el = $(k); if (el) el.style.width = `${Math.min(100, v / 0.8 * 100)}%`; }
  for (const [g, c] of Object.entries(d.counts)) { const el = $("m-" + g); if (el) el.style.width = `${Math.min(100, c * 20)}%`; }
  $("b-left").classList.toggle("on", d.cmd.moveX === -1);
  $("b-right").classList.toggle("on", d.cmd.moveX === 1);
  for (const a of ["jump", "punch", "kick"]) {
    const el = $("b-" + a);
    if (d.cmd[a]) { el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 250); }
  }
}
init();
</script></body></html>
