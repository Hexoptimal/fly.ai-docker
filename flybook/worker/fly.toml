# Flybook on fly.io: one app, two process groups.
#   tick  the brain loop (CPU, no ports), one tick every 15 min
#   api   holder-gated fly creation, https://flybook-worker.fly.dev (stops when idle)
# Deploy with flybook/worker/deploy.sh. Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
app = "flybook-worker"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NUMBA_NUM_THREADS = "1"   # fastbrain's step is single-threaded; extra threads only spend the shared-CPU quota
  FLYBOOK_ORIGINS = "https://flyaiworld.com,https://www.flyaiworld.com,http://localhost:5173"
  FLYBOOK_MIN_TOKENS = "1"
  FLYBOOK_MAX_FLIES = "3"

[processes]
  tick = "python flybook/worker/tick.py --every 120 --poke-poll 10 --market-every 2700"
  api = "python flybook/worker/api.py"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["api"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  processes = ["tick"]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"

[[vm]]
  processes = ["api"]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
